<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Naut presentation and customization</title>
<desc id="desc">Three stylized Profile presentations show that appearance can change without changing the media.</desc>
