<g transform="translate(735 266)"><rect width="116" height="48" rx="24" fill="#182838" stroke="#5BC0EB"/><text x="58" y="30" text-anchor="middle" class="m">Rotate</text><rect x="132" width="116" height="48" rx="24" fill="#182838" stroke="#5BC0EB"/><text x="190" y="30" text-anchor="middle" class="m">Pan</text><rect x="264" width="116" height="48" rx="24" fill="#182838" stroke="#5BC0EB"/><text x="322" y="30" text-anchor="middle" class="m">Zoom</text></g>
