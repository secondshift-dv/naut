<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Naut interactive 3D Figures</title>
<desc id="desc">Stylized interactive 3D Figure on a pedestal with rotate, pan, and zoom controls.</desc>
<defs>
<linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1017"/><stop offset="1" stop-color="#151624"/></linearGradient>
<linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4D35E"/><stop offset="1" stop-color="#E79A39"/></linearGradient>
<radialGradient id="halo3"><stop stop-color="#7C6CFF" stop-opacity=".28"/><stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/></radialGradient>
<style>.t{font:700 34px "Segoe UI",Arial,sans-serif;fill:#F7F9FC}.s{font:500 18px "Segoe UI",Arial,sans-serif;fill:#9AA8BA}.l{font:700 18px "Segoe UI",Arial,sans-serif;fill:#F7F9FC}.m{font:500 15px "Segoe UI",Arial,sans-serif;fill:#AAB5C5}.tag{font:700 12px "Segoe UI",Arial,sans-serif;fill:#0B1017;letter-spacing:1.4px}</style>
</defs>
<rect width="1200" height="560" rx="34" fill="url(#bg3)"/>
