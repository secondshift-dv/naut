<style>.t{font:700 34px "Segoe UI",Arial,sans-serif;fill:#F7F9FC}.s{font:500 18px "Segoe UI",Arial,sans-serif;fill:#9AA8BA}.l{font:700 17px "Segoe UI",Arial,sans-serif;fill:#F7F9FC}.m{font:500 14px "Segoe UI",Arial,sans-serif;fill:#AAB5C5}.tag{font:700 12px "Segoe UI",Arial,sans-serif;fill:#0B1017;letter-spacing:1.4px}</style>
