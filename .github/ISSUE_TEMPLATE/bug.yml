name: Bug report
description: Report a reproducible problem in Naut
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private Vault data, personal media, secrets, or exploit details. Security issues belong in Private Vulnerability Reporting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reproducible sequence.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Naut version
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: risk
    attributes:
      label: Area
      options:
        - UI / presentation
        - Import / media processing
        - Vault / persistence
        - 3D / native renderer
        - Updater / release
        - Build / packaging
        - Other
    validations:
      required: true
