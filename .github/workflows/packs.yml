name: Optional Packs
on:
  pull_request:
    branches: [main]
    paths:
      - 'packs/**'
      - 'src/Neuterradise.Runtime/Presentation/**'
      - 'src/Neuterradise.Runtime/Neuterradise.Runtime.csproj'
      - 'src/Neuterradise.Runtime/packages.lock.json'
      - 'scripts/verify.ps1'
      - 'scripts/verification/verify-packs.ps1'
      - 'scripts/verification/verify-privacy.ps1'
      - 'scripts/verification/diagnostics/CuratedPacksProbe.cs'
      - 'scripts/utilities/package-packs.ps1'
      - 'scripts/utilities/publish-packs.ps1'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/packs.yml'
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - 'src/Neuterradise.Runtime/Presentation/**'
      - 'src/Neuterradise.Runtime/Neuterradise.Runtime.csproj'
      - 'src/Neuterradise.Runtime/packages.lock.json'
      - 'scripts/verify.ps1'
      - 'scripts/verification/verify-packs.ps1'
      - 'scripts/verification/verify-privacy.ps1'
      - 'scripts/verification/diagnostics/CuratedPacksProbe.cs'
      - 'scripts/utilities/package-packs.ps1'
      - 'scripts/utilities/publish-packs.ps1'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/packs.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated collection and signed registry to Pages
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: optional-packs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  packs:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Validate and package optional collection
        shell: pwsh
        run: ./scripts/verify.ps1 -Scope Packs
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-packs-${{ github.sha }}
          path: |
            out/pack-downloads/*.ntpack
            out/pack-downloads/checksums.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.repository == 'secondshift-dv/naut' && github.ref == 'refs/heads/main' }}
    needs: packs
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: optional-packs-${{ github.sha }}
          path: out/pack-downloads
      - name: Enforce workflow trust policy
        shell: pwsh
        run: ./scripts/verify.ps1 -Scope WorkflowPolicy
      - name: Sign and publish validated pack collection
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEUTERRADISE_UPDATE_SIGNING_KEY_PEM: ${{ secrets.NEUTERRADISE_UPDATE_SIGNING_KEY_PEM }}
        run: ./scripts/utilities/publish-packs.ps1 -Publish -Prepared
      - name: Remove consumed pack handoff
        if: ${{ success() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $name = "optional-packs-$env:GITHUB_SHA"
          $inventory = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list pack handoff artifacts.' }
          $matches = @($inventory.artifacts | Where-Object { $_.name -ceq $name })
          if ($matches.Count -ne 1) { throw 'Expected exactly one pack handoff.' }
          gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($matches[0].id)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot delete consumed pack handoff.' }
